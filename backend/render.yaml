services:
  - type: web
    name: cms-demo-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: npm run db:migrate && npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        fromDatabase:
          name: cms-demo-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 24h
      - key: FRONTEND_URL
        sync: false
      - key: MIDTRANS_IS_PRODUCTION
        value: false
      - key: DEMO_USER_PASSWORD
        sync: false

databases:
  - name: cms-demo-db
    plan: free
    databaseName: cms_demo
    user: cms_demo
